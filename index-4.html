<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Tiny Ask</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f6f5f0;
            --primary-green: #a3b18a;
            --primary-green-hover: #8e9e75;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --accent: #d35400;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
        }

        .hidden { display: none !important; }

        .tiny-ask {
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .main-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 42px;
            line-height: 1.2;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .highlight {
            color: var(--accent);
            font-style: italic;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 40px;
            font-weight: 600;
        }

        .btn {
            font-family: 'Nunito', sans-serif;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 800;
        }

        .btn-yes {
            background-color: var(--primary-green);
            color: #ffffff;
            font-size: 28px;
            padding: 18px 40px;
            width: 100%;
            box-shadow: 0 8px 15px rgba(163, 177, 138, 0.4);
        }

        .btn-yes:hover {
            background-color: var(--primary-green-hover);
            transform: scale(1.02);
        }

        .btn-no {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid #bdc3c7;
            padding: 10px 25px;
            font-size: 16px;
            margin-top: 20px;
            position: relative;
            z-index: 50;
        }

        .card {
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        img.gif {
            width: 160px;
            height: 160px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 800;
            margin-bottom: 5px;
            color: var(--text-dark);
            font-size: 14px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
            box-sizing: border-box;
            background-color: #fafafa;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary-green);
        }

        .btn-submit {
            background-color: var(--text-dark);
            color: white;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            margin-top: 15px;
        }

        .btn-submit:hover {
            background-color: #1a252f;
        }

        .ticket {
            border: 2px dashed var(--primary-green);
            padding: 25px;
            background-color: #f9fbf9;
            border-radius: 15px;
            margin-top: 20px;
            text-align: left;
        }

        .ticket p {
            margin: 8px 0;
            font-size: 16px;
            color: var(--text-dark);
        }

        .btn-email {
            background-color: var(--primary-green);
            color: white;
            text-decoration: none;
            display: block;
            padding: 15px;
            border-radius: 12px;
            margin-top: 25px;
            font-size: 18px;
            font-weight: 800;
            box-shadow: 0 5px 15px rgba(163, 177, 138, 0.4);
        }

        .btn-email:hover {
            background-color: var(--primary-green-hover);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div id="step1" class="container">
        <div class="tiny-ask">A TINY ASK</div>
        <h1 class="main-title">Will you go <br><span class="highlight">out</span> with me?</h1>
        <div class="subtitle">(There is only one correct answer)</div>

        <button id="btn-yes" class="btn btn-yes" onclick="showStep(2)">YES</button>
        <button id="btn-no" class="btn btn-no">No</button>
    </div>
